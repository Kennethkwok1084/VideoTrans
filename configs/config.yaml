system:
  cron_start: 0
  cron_end: 0
  max_workers: 3  
  scan_interval: 10  # 扫描间隔（分钟）
  scheduler_interval: 10  # 调度器检查间隔（秒）
  task_queue_size: 10  # 任务队列容量
  min_disk_space_gb: 5  # 最小磁盘空间要求（GB）

# Web API 配置
web:
  api_key: ""  # API 密钥（为空则禁用认证，生产环境务必设置）

scheduler:
  atomic_claim: true  # 启用原子 Claim 调度（Phase 4 优化）

retry:
  backoff_enabled: true  # 启用指数退避重试（Phase 4 优化）
  base_delay_seconds: 60  # 基础延迟时间（秒）
  max_delay_seconds: 3600  # 最大延迟时间（1小时）
  # 可重试错误白名单（留空使用默认分类逻辑）
  retryable_errors:
    - "timeout"           # 超时（IO卡住或进程超时）
    - "output_error"      # 输出文件损坏
    - "io_error"          # IO/挂载盘问题

path:
  # 输入输出目录配对（可在Web界面管理）
  pairs:
    - input: "/mnt/pve/media/downloads"
      output: "/mnt/pve/media/archive"
  trash: ".stm_trash"  # 相对路径，在各输入目录下的 .stm_trash
  database: "/data/tasks.db"

ffmpeg:
  codec: "libx264"
  preset: "veryslow"
  crf: 32
  audio: "aac"
  audio_bitrate: "128k"
  output_extension: ".mp4"  # 统一输出容器，提升兼容性
  verify_decode_seconds: 2  # 输出校验解码时长（秒）
  verify_tail_seek_seconds: 10  # 从末尾回退秒数，抽样校验尾部（0为关闭）
  discard_corrupt: true  # 解码时丢弃损坏帧，避免空帧
  corrupt_strategy: "auto"  # auto=少量损坏丢帧，多则补帧；discard=只丢帧；cfr=只补帧
  corrupt_probe_seconds: 30  # 抽样检测时长（秒）
  corrupt_error_threshold: 5  # 抽样错误行数阈值
  output_fps: 30  # 补帧时输出帧率
  extensions: [".mp4", ".mkv", ".avi", ".ts", ".mov", ".flv", ".wmv", ".m4v", ".webm"]
  strict_check: true  # 转码前严格检查文件完整性，跳过损坏文件
  probe_timeout_seconds: 30
  progress_stall_minutes: 10
  max_duration_hours: 2
  duration_factor: 2.0
  duration_extra_minutes: 15
  # 排除规则（支持通配符）
  exclude_patterns:
    - "SYNOPHOTO_*"           # 群晖缩略图/视频
    - "@eaDir/*"               # 群晖索引目录
    - "#recycle/*"             # 群晖回收站
    - ".*"                     # 隐藏文件
    - "*.tmp"                  # 临时文件
    - "*.part"                 # 未完成的下载

cleaning:
  soft_delete_days: 7   # 移入垃圾桶天数
  hard_delete_days: 30  # 彻底删除天数
  cleanup_retry_batch: 200  # cleanup_error 自动重试批次
  cron: "0 10 * * *"    # 清理任务时间（Cron 表达式）

log:
  level: "info"  # debug, info, warn, error
  file: "/data/stm.log"

# ============================================================
# 硬件编码配置（Phase 5.x）
# ============================================================
# 运行模式：docker（仅CPU）或 systemd（支持硬件编码）
run_mode: "systemd"  # docker | systemd

# CPU 回退：硬件编码失败时是否自动回退到 CPU 编码
cpu_fallback: true

# 编码器 Profile 列表
encoder_profiles:
  # CPU 编码 Profile（兜底方案）
  - name: "cpu_baseline"
    type: "cpu"
    codec: "libx264"
    params:
      preset: "veryslow"
      crf: "32"
      audio: "aac"
      audio_bitrate: "128k"

  # NVIDIA 硬件编码 Profile（仅 systemd 模式可用）
  - name: "nvidia_high"
    type: "nvidia"
    codec: "h264_nvenc"
    params:
      preset: "p7"          # p1-p7, p7最慢质量最高
      cq: "32"              # 质量参数（类似crf，越低质量越高）32=激进压缩
      audio: "aac"
      audio_bitrate: "128k"

  # Intel QSV 硬件编码 Profile（仅 systemd 模式可用）
  - name: "intel_balanced"
    type: "intel"
    codec: "h264_qsv"
    params:
      preset: "veryslow"
      global_quality: "32"  # 质量参数，32=激进压缩
      audio: "aac"
      audio_bitrate: "128k"

# Worker 到 Profile 的映射（循环分配）
# 示例：3个worker时，worker-1用cpu，worker-2用nvidia，worker-3用intel
# Docker模式下会自动降级为CPU profile
worker_mapping:
  - "nvidia_high"         # worker-1, worker-4, worker-7... (仅systemd模式)
  - "intel_balanced"      # worker-2, worker-5, worker-8... (仅systemd模式)
  - "cpu_baseline"        # worker-3, worker-6, worker-9... (CPU 回退)
