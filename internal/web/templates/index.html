<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STM 视频转码服务 - 仪表盘</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes pulse-soft {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.6;
            }
        }

        .pulse-soft {
            animation: pulse-soft 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
    </style>
</head>

<body class="bg-gray-50 min-h-screen">
    <!-- 导航栏 -->
    <nav class="bg-white shadow-sm border-b border-gray-200">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <div class="flex items-center">
                    <h1 class="text-2xl font-bold text-gray-900">📹 STM 转码服务</h1>
                </div>
                <div class="flex items-center space-x-4">
                    <a href="/" class="px-4 py-2 text-blue-600 font-semibold border-b-2 border-blue-600">仪表盘</a>
                    <a href="/tasks" class="px-4 py-2 text-gray-600 hover:text-gray-900">任务列表</a>
                    <a href="/trash" class="px-4 py-2 text-gray-600 hover:text-gray-900">垃圾桶</a>
                </div>
            </div>
        </div>
    </nav>

    <!-- 主内容 -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <!-- 监控目录管理卡片 -->
        <div class="bg-white rounded-lg shadow-md p-6 mb-6">
            <div class="flex items-center justify-between mb-4">
                <h2 class="text-lg font-semibold text-gray-900">监控目录</h2>
                <button id="btnAddDirectory"
                    class="px-4 py-2 bg-green-600 text-white text-sm rounded-md hover:bg-green-700 transition">
                    + 添加目录
                </button>
            </div>
            <div id="directoryList" class="space-y-2">
                <p class="text-sm text-gray-500 text-center py-4">加载中...</p>
            </div>
        </div>

        <!-- Worker 状态卡片 -->
        <div class="bg-white rounded-lg shadow-md p-6 mb-6">
            <div class="flex items-center justify-between">
                <div class="flex-1">
                    <h2 class="text-lg font-semibold text-gray-900 mb-2">Worker 状态</h2>
                    <div class="flex items-center space-x-6">
                        <div id="workerStatus" class="flex items-center">
                            <div id="statusIndicator" class="w-3 h-3 rounded-full mr-2 pulse-soft"></div>
                            <span id="statusText" class="text-sm font-medium">加载中...</span>
                        </div>
                        <div class="text-sm text-gray-600">
                            已启动 <span id="workerCount">0</span> / <span id="maxWorkers">3</span> 个 Worker，
                            处理中 <span id="activeTasks">0</span> 个任务
                        </div>
                        <div class="flex items-center space-x-2">
                            <label class="text-sm text-gray-600">最大并发:</label>
                            <button id="btnDecreaseWorker"
                                class="w-8 h-8 bg-gray-200 hover:bg-gray-300 rounded text-gray-700 font-bold transition">-</button>
                            <input id="inputMaxWorkers" type="number" min="1" max="10" value="3"
                                class="w-16 px-2 py-1 border border-gray-300 rounded text-center">
                            <button id="btnIncreaseWorker"
                                class="w-8 h-8 bg-gray-200 hover:bg-gray-300 rounded text-gray-700 font-bold transition">+</button>
                            <button id="btnApplyWorkers"
                                class="px-3 py-1 bg-indigo-600 text-white text-sm rounded hover:bg-indigo-700 transition">应用</button>
                        </div>
                    </div>
                </div>
                <div class="flex space-x-2">
                    <button id="btnScan"
                        class="px-4 py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700 transition">
                        扫描目录
                    </button>
                    <button id="btnForceStart"
                        class="px-4 py-2 bg-green-600 text-white rounded-md hover:bg-green-700 transition hidden">
                        强制启动
                    </button>
                    <button id="btnForceStop"
                        class="px-4 py-2 bg-red-600 text-white rounded-md hover:bg-red-700 transition hidden">
                        停止强制
                    </button>
                </div>
            </div>
        </div>

        <!-- 统计卡片 -->
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 mb-6">
            <!-- 待处理 -->
            <div class="bg-white rounded-lg shadow-md p-6">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-sm font-medium text-gray-600">待处理</p>
                        <p id="statPending" class="text-3xl font-bold text-yellow-600 mt-2">-</p>
                    </div>
                    <div class="w-12 h-12 bg-yellow-100 rounded-full flex items-center justify-center">
                        <span class="text-2xl">⏳</span>
                    </div>
                </div>
            </div>

            <!-- 处理中 -->
            <div class="bg-white rounded-lg shadow-md p-6">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-sm font-medium text-gray-600">处理中</p>
                        <p id="statProcessing" class="text-3xl font-bold text-blue-600 mt-2">-</p>
                    </div>
                    <div class="w-12 h-12 bg-blue-100 rounded-full flex items-center justify-center">
                        <span class="text-2xl">⚙️</span>
                    </div>
                </div>
            </div>

            <!-- 已完成 -->
            <div class="bg-white rounded-lg shadow-md p-6">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-sm font-medium text-gray-600">已完成</p>
                        <p id="statCompleted" class="text-3xl font-bold text-green-600 mt-2">-</p>
                    </div>
                    <div class="w-12 h-12 bg-green-100 rounded-full flex items-center justify-center">
                        <span class="text-2xl">✅</span>
                    </div>
                </div>
            </div>

            <!-- 节省空间 -->
            <div class="bg-white rounded-lg shadow-md p-6">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-sm font-medium text-gray-600">节省空间</p>
                        <p id="statSaved" class="text-3xl font-bold text-purple-600 mt-2">-</p>
                        <p class="text-xs text-gray-500 mt-1">GB</p>
                    </div>
                    <div class="w-12 h-12 bg-purple-100 rounded-full flex items-center justify-center">
                        <span class="text-2xl">💾</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- 失败任务列表 -->
        <div class="bg-white rounded-lg shadow-md p-6">
            <div class="flex items-center justify-between mb-4">
                <h2 class="text-lg font-semibold text-gray-900">失败任务</h2>
                <span id="failedCount" class="text-sm text-red-600 font-medium">0 个任务</span>
            </div>
            <div id="failedTasks" class="space-y-3">
                <p class="text-sm text-gray-500 text-center py-8">暂无失败任务</p>
            </div>
        </div>
    </main>

    <script>
        // 全局状态
        let workerStatus = null;

        function getLogText(task) {
            if (!task || !task.log) return '';
            if (typeof task.log === 'string') return task.log;
            if (task.log.Valid) return task.log.String || '';
            return '';
        }

        function formatLogSnippet(text, maxLen) {
            if (!text) return '';
            if (text.length <= maxLen) return text;
            return text.slice(0, maxLen) + '...';
        }

        function escapeHtml(value) {
            return String(value)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        // 加载监控目录列表
        async function loadDirectories() {
            try {
                const res = await fetch('/api/directories');
                const data = await res.json();

                const listEl = document.getElementById('directoryList');

                if (!data.pairs || data.pairs.length === 0) {
                    listEl.innerHTML = '<p class="text-sm text-gray-500 text-center py-4">暂无监控目录</p>';
                    return;
                }

                listEl.innerHTML = data.pairs.map(pair => `
                    <div class="p-3 bg-gray-50 rounded-md space-y-2">
                        <div class="flex items-center justify-between">
                            <div class="flex items-center space-x-2 flex-1 min-w-0">
                                <span class="text-xl">📥</span>
                                <span class="text-sm font-medium text-gray-900 truncate">${pair.input}</span>
                            </div>
                            <button onclick="removeDirectory('${pair.input}')" 
                                class="ml-2 px-3 py-1 text-xs text-red-600 hover:text-red-800 hover:bg-red-50 rounded transition flex-shrink-0">
                                删除
                            </button>
                        </div>
                        <div class="flex items-center space-x-2 ml-7">
                            <span class="text-xl">📤</span>
                            <span class="text-sm text-blue-600 truncate">${pair.output}</span>
                        </div>
                    </div>
                `).join('');
            } catch (err) {
                console.error('加载目录列表失败:', err);
            }
        }

        // 添加监控目录
        async function addDirectory() {
            // 显示目录浏览对话框
            const modal = document.createElement('div');
            modal.className = 'fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50';
            modal.innerHTML = `
                <div class="bg-white rounded-lg shadow-xl p-6 w-full max-w-2xl max-h-[80vh] flex flex-col">
                    <div class="flex items-center justify-between mb-4">
                        <h3 class="text-lg font-semibold">添加监控目录配对</h3>
                        <button onclick="this.closest('.fixed').remove()" class="text-gray-500 hover:text-gray-700">✕</button>
                    </div>
                    
                    <!-- 已选择的目录显示 -->
                    <div class="mb-4 p-3 bg-blue-50 rounded-lg space-y-2">
                        <div class="flex items-center space-x-2">
                            <span class="text-sm font-semibold text-gray-700">📥 输入目录:</span>
                            <span id="selectedInputDir" class="text-sm text-blue-600 font-mono">未选择</span>
                        </div>
                        <div class="flex items-center space-x-2">
                            <span class="text-sm font-semibold text-gray-700">📤 输出目录:</span>
                            <span id="selectedOutputDir" class="text-sm text-blue-600 font-mono">未选择</span>
                        </div>
                    </div>
                    
                    <!-- 选择提示 -->
                    <div class="mb-2 text-sm text-gray-600">
                        <span id="selectHint">请选择输入目录（监控来源）</span>
                    </div>
                    
                    <div class="mb-4">
                        <div class="flex items-center space-x-2 text-sm text-gray-600 mb-2">
                            <span>当前路径:</span>
                            <span id="currentPath" class="font-mono bg-gray-100 px-2 py-1 rounded">/mnt</span>
                        </div>
                        <button id="btnParentDir" class="px-3 py-1 text-sm bg-gray-200 hover:bg-gray-300 rounded">↑ 上级目录</button>
                    </div>
                    <div id="dirBrowser" class="flex-1 overflow-y-auto border border-gray-200 rounded mb-4 p-2">
                        <p class="text-center text-gray-500 py-8">加载中...</p>
                    </div>
                    <div class="flex space-x-2">
                        <button id="btnConfirmDir" class="flex-1 px-4 py-2 bg-green-600 text-white rounded hover:bg-green-700 opacity-50" disabled>
                            确定添加
                        </button>
                        <button onclick="this.closest('.fixed').remove()" class="px-4 py-2 bg-gray-300 text-gray-700 rounded hover:bg-gray-400">
                            取消
                        </button>
                    </div>
                </div>
            `;
            document.body.appendChild(modal);

            let currentPath = '';
            let selectedInputPath = '';
            let selectedOutputPath = '';

            function updateSelectHint() {
                const hintEl = document.getElementById('selectHint');
                const btnConfirm = document.getElementById('btnConfirmDir');

                if (!selectedInputPath) {
                    hintEl.textContent = '请选择输入目录（监控来源）';
                    btnConfirm.disabled = true;
                    btnConfirm.classList.add('opacity-50');
                } else if (!selectedOutputPath) {
                    hintEl.textContent = '请选择输出目录（转码目标）';
                    btnConfirm.disabled = true;
                    btnConfirm.classList.add('opacity-50');
                } else {
                    hintEl.textContent = '✅ 已选择完成，点击"确定添加"';
                    btnConfirm.disabled = false;
                    btnConfirm.classList.remove('opacity-50');
                }
            }

            async function browsePath(path) {
                try {
                    const res = await fetch(`/api/directories/browse?path=${encodeURIComponent(path)}`);
                    const data = await res.json();

                    if (!res.ok) {
                        alert('浏览目录失败: ' + data.error);
                        return;
                    }

                    currentPath = data.current_path;
                    document.getElementById('currentPath').textContent = currentPath;

                    const browser = document.getElementById('dirBrowser');
                    if (!data.directories || data.directories.length === 0) {
                        browser.innerHTML = '<p class="text-center text-gray-500 py-8">此目录下没有子目录</p>';
                        return;
                    }

                    browser.innerHTML = data.directories.map(dir => `
                        <div class="dir-item flex items-center justify-between p-2 hover:bg-gray-100 rounded cursor-pointer" data-path="${dir.path}">
                            <div class="flex items-center space-x-2">
                                <span class="text-xl">📁</span>
                                <span class="text-sm font-medium">${dir.name}</span>
                            </div>
                            <div class="space-x-2">
                                <button class="btn-browse px-2 py-1 text-xs bg-blue-100 text-blue-700 rounded hover:bg-blue-200">浏览</button>
                                <button class="btn-select px-2 py-1 text-xs bg-green-100 text-green-700 rounded hover:bg-green-200">选择</button>
                            </div>
                        </div>
                    `).join('');

                    // 绑定事件
                    browser.querySelectorAll('.btn-browse').forEach(btn => {
                        btn.addEventListener('click', (e) => {
                            e.stopPropagation();
                            const path = e.target.closest('.dir-item').dataset.path;
                            browsePath(path);
                        });
                    });

                    browser.querySelectorAll('.btn-select').forEach(btn => {
                        btn.addEventListener('click', (e) => {
                            e.stopPropagation();
                            const path = e.target.closest('.dir-item').dataset.path;

                            // 根据当前状态决定选择的是输入还是输出目录
                            if (!selectedInputPath) {
                                selectedInputPath = path;
                                document.getElementById('selectedInputDir').textContent = path;
                                document.getElementById('selectedInputDir').classList.add('font-semibold');
                            } else if (!selectedOutputPath) {
                                selectedOutputPath = path;
                                document.getElementById('selectedOutputDir').textContent = path;
                                document.getElementById('selectedOutputDir').classList.add('font-semibold');
                            } else {
                                // 两个都已选择，重置为选择新的输入目录
                                selectedInputPath = path;
                                selectedOutputPath = '';
                                document.getElementById('selectedInputDir').textContent = path;
                                document.getElementById('selectedInputDir').classList.add('font-semibold');
                                document.getElementById('selectedOutputDir').textContent = '未选择';
                                document.getElementById('selectedOutputDir').classList.remove('font-semibold');
                            }

                            updateSelectHint();

                            // 高亮选中的项
                            browser.querySelectorAll('.dir-item').forEach(item => item.classList.remove('bg-green-50', 'border-2', 'border-green-500'));
                            e.target.closest('.dir-item').classList.add('bg-green-50', 'border-2', 'border-green-500');
                        });
                    });

                } catch (err) {
                    alert('浏览目录失败: ' + err.message);
                }
            }

            // 上级目录按钮
            document.getElementById('btnParentDir').addEventListener('click', () => {
                if (currentPath && currentPath !== '/') {
                    const parent = currentPath.split('/').slice(0, -1).join('/') || '/';
                    browsePath(parent);
                }
            });

            // 确定按钮
            document.getElementById('btnConfirmDir').addEventListener('click', async () => {
                if (!selectedInputPath || !selectedOutputPath) {
                    alert('请选择输入和输出目录');
                    return;
                }

                try {
                    const res = await fetch('/api/directories', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            input_dir: selectedInputPath,
                            output_dir: selectedOutputPath
                        })
                    });
                    const data = await res.json();

                    if (res.ok) {
                        const warning = data.warning ? `\n\n注意: ${data.warning}` : '';
                        alert(`目录配对已添加:\n输入: ${selectedInputPath}\n输出: ${selectedOutputPath}${warning}`);
                        modal.remove();
                        loadDirectories();
                    } else {
                        alert('添加失败: ' + data.error);
                    }
                } catch (err) {
                    alert('操作失败: ' + err.message);
                }
            });

            // 初始加载
            browsePath('');
        }

        // 删除监控目录配对
        async function removeDirectory(inputDir) {
            if (!confirm(`确定要删除此目录配对吗？\n输入: ${inputDir}`)) return;

            try {
                const res = await fetch('/api/directories', {
                    method: 'DELETE',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ input_dir: inputDir })
                });
                const data = await res.json();

                if (res.ok) {
                    const warning = data.warning ? `\n注意: ${data.warning}` : '';
                    alert(`目录配对已删除${warning}`);
                    loadDirectories();
                } else {
                    alert('删除失败: ' + data.error);
                }
            } catch (err) {
                alert('操作失败: ' + err.message);
            }
        }

        // 加载统计数据
        async function loadStats() {
            try {
                const res = await fetch('/api/stats');
                const data = await res.json();

                document.getElementById('statPending').textContent = data.pending || 0;
                document.getElementById('statProcessing').textContent = data.processing || 0;
                document.getElementById('statCompleted').textContent = data.completed || 0;
                document.getElementById('statSaved').textContent = (data.saved_gb || 0).toFixed(2);
            } catch (err) {
                console.error('加载统计失败:', err);
            }
        }

        // 加载 Worker 状态
        async function loadWorkerStatus() {
            try {
                const res = await fetch('/api/worker/status');
                workerStatus = await res.json();

                const indicator = document.getElementById('statusIndicator');
                const statusText = document.getElementById('statusText');
                const btnForceStart = document.getElementById('btnForceStart');
                const btnForceStop = document.getElementById('btnForceStop');

                document.getElementById('workerCount').textContent = workerStatus.worker_count || 0;
                document.getElementById('maxWorkers').textContent = workerStatus.max_workers || 3;
                document.getElementById('activeTasks').textContent = workerStatus.active_tasks || 0;
                document.getElementById('inputMaxWorkers').value = workerStatus.max_workers || 3;
                statusText.textContent = workerStatus.mode;

                // 更新状态指示器
                if (workerStatus.active) {
                    indicator.className = 'w-3 h-3 rounded-full mr-2 bg-green-500 pulse-soft';
                } else {
                    indicator.className = 'w-3 h-3 rounded-full mr-2 bg-gray-400';
                }

                // 显示/隐藏按钮
                if (workerStatus.force_run) {
                    btnForceStart.classList.add('hidden');
                    btnForceStop.classList.remove('hidden');
                } else {
                    btnForceStart.classList.remove('hidden');
                    btnForceStop.classList.add('hidden');
                }
            } catch (err) {
                console.error('加载 Worker 状态失败:', err);
            }
        }

        // 加载失败任务
        async function loadFailedTasks() {
            try {
                const res = await fetch('/api/tasks?status=failed&limit=5');
                const tasks = await res.json();

                const container = document.getElementById('failedTasks');
                const countEl = document.getElementById('failedCount');

                if (tasks.length === 0) {
                    container.innerHTML = '<p class="text-sm text-gray-500 text-center py-8">暂无失败任务</p>';
                    countEl.textContent = '0 个任务';
                    return;
                }

                countEl.textContent = `${tasks.length} 个任务`;
                container.innerHTML = tasks.map(task => {
                    const logText = getLogText(task);
                    const logSnippet = formatLogSnippet(logText, 120);
                    const displayText = logSnippet || '未知错误';
                    const titleText = logText || displayText;

                    return `
                    <div class="flex items-center justify-between p-3 bg-red-50 rounded-lg border border-red-200">
                        <div class="flex-1 min-w-0">
                            <p class="text-sm font-medium text-gray-900 truncate">${task.source_path}</p>
                            <p class="text-xs text-red-600 mt-1" title="${escapeHtml(titleText)}">${escapeHtml(displayText)}</p>
                        </div>
                        <button onclick="retryTask(${task.id})" 
                                class="ml-4 px-3 py-1 text-xs bg-red-600 text-white rounded hover:bg-red-700 transition">
                            重试
                        </button>
                    </div>
                `;
                }).join('');
            } catch (err) {
                console.error('加载失败任务失败:', err);
            }
        }

        // 扫描目录
        document.getElementById('btnScan').addEventListener('click', async () => {
            const btn = event.target;
            btn.disabled = true;
            btn.textContent = '扫描中...';

            try {
                await fetch('/api/scan', { method: 'POST' });
                alert('扫描任务已启动');
                setTimeout(loadStats, 2000);
            } catch (err) {
                alert('扫描失败: ' + err.message);
            } finally {
                btn.disabled = false;
                btn.textContent = '扫描目录';
            }
        });

        // 强制启动
        document.getElementById('btnForceStart').addEventListener('click', async () => {
            try {
                await fetch('/api/worker/force-start', { method: 'POST' });
                alert('已切换到强制运行模式');
                loadWorkerStatus();
            } catch (err) {
                alert('操作失败: ' + err.message);
            }
        });

        // 停止强制
        document.getElementById('btnForceStop').addEventListener('click', async () => {
            try {
                await fetch('/api/worker/force-stop', { method: 'POST' });
                alert('已停止强制运行模式');
                loadWorkerStatus();
            } catch (err) {
                alert('操作失败: ' + err.message);
            }
        });

        // 添加目录按钮
        document.getElementById('btnAddDirectory').addEventListener('click', addDirectory);

        // Worker数量调整
        document.getElementById('btnDecreaseWorker').addEventListener('click', () => {
            const input = document.getElementById('inputMaxWorkers');
            const val = parseInt(input.value) || 1;
            if (val > 1) input.value = val - 1;
        });

        document.getElementById('btnIncreaseWorker').addEventListener('click', () => {
            const input = document.getElementById('inputMaxWorkers');
            const val = parseInt(input.value) || 1;
            if (val < 10) input.value = val + 1;
        });

        document.getElementById('btnApplyWorkers').addEventListener('click', async () => {
            const maxWorkers = parseInt(document.getElementById('inputMaxWorkers').value);
            if (maxWorkers < 1 || maxWorkers > 10) {
                alert('Worker数量必须在1-10之间');
                return;
            }

            try {
                const res = await fetch('/api/worker/set-max', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ max_workers: maxWorkers })
                });
                const data = await res.json();
                if (res.ok) {
                    const warning = data.warning ? `\n注意: ${data.warning}` : '';
                    alert(`最大Worker数量已更新为: ${maxWorkers}${warning}`);
                    loadWorkerStatus();
                } else {
                    alert('设置失败: ' + data.error);
                }
            } catch (err) {
                alert('操作失败: ' + err.message);
            }
        });

        // 重试任务
        async function retryTask(id) {
            try {
                await fetch(`/api/tasks/${id}/retry`, { method: 'POST' });
                alert('任务已重新加入队列');
                loadStats();
                loadFailedTasks();
            } catch (err) {
                alert('重试失败: ' + err.message);
            }
        }

        // 初始化
        loadDirectories();
        loadStats();
        loadWorkerStatus();
        loadFailedTasks();

        // 定期刷新（每 5 秒）
        setInterval(() => {
            loadStats();
            loadWorkerStatus();
            loadFailedTasks();
        }, 5000);
    </script>
</body>

</html>
