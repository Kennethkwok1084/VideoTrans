<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>垃圾桶 - STM 视频转码服务</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-50 min-h-screen">
    <!-- 导航栏 -->
    <nav class="bg-white shadow-sm border-b border-gray-200">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <div class="flex items-center">
                    <h1 class="text-2xl font-bold text-gray-900">📹 STM 转码服务</h1>
                </div>
                <div class="flex items-center space-x-4">
                    <a href="/" class="px-4 py-2 text-gray-600 hover:text-gray-900">仪表盘</a>
                    <a href="/tasks" class="px-4 py-2 text-gray-600 hover:text-gray-900">任务列表</a>
                    <a href="/trash" class="px-4 py-2 text-blue-600 font-semibold border-b-2 border-blue-600">垃圾桶</a>
                </div>
            </div>
        </div>
    </nav>

    <!-- 主内容 -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <!-- 警告提示 -->
        <div class="bg-yellow-50 border-l-4 border-yellow-400 p-4 mb-6">
            <div class="flex">
                <div class="flex-shrink-0">
                    <span class="text-2xl">⚠️</span>
                </div>
                <div class="ml-3">
                    <p class="text-sm text-yellow-700">
                        垃圾桶中的文件将在 <strong>30 天后自动永久删除</strong>。删除操作不可撤销，请谨慎操作。
                    </p>
                </div>
            </div>
        </div>

        <!-- 统计信息 -->
        <div class="bg-white rounded-lg shadow-md p-6 mb-6">
            <div class="flex items-center justify-between">
                <div>
                    <h2 class="text-lg font-semibold text-gray-900">垃圾桶统计</h2>
                    <p class="text-sm text-gray-600 mt-1">
                        共 <span id="fileCount" class="font-medium">0</span> 个文件，
                        占用 <span id="totalSize" class="font-medium">0 MB</span>
                    </p>
                </div>
                <div class="flex gap-3">
                    <button onclick="restoreAllFiles()"
                        class="px-4 py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700 transition">
                        一键恢复全部
                    </button>
                    <button onclick="emptyTrash()"
                        class="px-4 py-2 bg-red-600 text-white rounded-md hover:bg-red-700 transition">
                        清空垃圾桶
                    </button>
                </div>
            </div>
        </div>

        <!-- 文件列表 -->
        <div class="bg-white rounded-lg shadow-md overflow-hidden">
            <table class="min-w-full divide-y divide-gray-200">
                <thead class="bg-gray-50">
                    <tr>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                            文件名
                        </th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                            大小
                        </th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                            删除时间
                        </th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                            剩余时间
                        </th>
                        <th class="px-6 py-3 text-right text-xs font-medium text-gray-500 uppercase tracking-wider">
                            操作
                        </th>
                    </tr>
                </thead>
                <tbody id="trashTableBody" class="bg-white divide-y divide-gray-200">
                    <tr>
                        <td colspan="5" class="px-6 py-12 text-center text-gray-500">
                            加载中...
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>

    <!-- 删除确认对话框 -->
    <div id="deleteModal" class="hidden fixed inset-0 bg-gray-600 bg-opacity-50 overflow-y-auto h-full w-full z-50">
        <div class="relative top-20 mx-auto p-5 border w-96 shadow-lg rounded-md bg-white">
            <div class="mt-3 text-center">
                <div class="mx-auto flex items-center justify-center h-12 w-12 rounded-full bg-red-100">
                    <span class="text-2xl">🗑️</span>
                </div>
                <h3 class="text-lg leading-6 font-medium text-gray-900 mt-4">确认删除</h3>
                <div class="mt-2 px-7 py-3">
                    <p class="text-sm text-gray-500">
                        确定要永久删除 <strong id="deleteFileName"></strong> 吗？
                    </p>
                    <p class="text-xs text-red-600 mt-2">
                        此操作不可撤销！
                    </p>
                </div>
                <div class="flex gap-4 mt-4">
                    <button onclick="closeDeleteModal()"
                        class="flex-1 px-4 py-2 bg-gray-300 text-gray-700 rounded-md hover:bg-gray-400 transition">
                        取消
                    </button>
                    <button onclick="confirmDelete()"
                        class="flex-1 px-4 py-2 bg-red-600 text-white rounded-md hover:bg-red-700 transition">
                        确认删除
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let deleteTarget = null;

        // HTML 转义函数，防止 XSS 注入
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // 格式化文件大小
        function formatSize(bytes) {
            if (bytes === 0) return '0 B';
            const k = 1024;
            const sizes = ['B', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return (bytes / Math.pow(k, i)).toFixed(2) + ' ' + sizes[i];
        }

        // 格式化时间
        function formatTime(dateStr) {
            if (!dateStr) return '-';
            const date = new Date(dateStr);
            return date.toLocaleString('zh-CN', {
                year: 'numeric',
                month: '2-digit',
                day: '2-digit',
                hour: '2-digit',
                minute: '2-digit'
            });
        }

        // 计算剩余天数
        function calculateDaysLeft(deleteTime) {
            if (!deleteTime) return '-';
            const deleteDate = new Date(deleteTime);
            const deleteDeadline = new Date(deleteDate.getTime() + 30 * 24 * 60 * 60 * 1000);
            const now = new Date();
            const daysLeft = Math.ceil((deleteDeadline - now) / (1000 * 60 * 60 * 24));

            if (daysLeft < 0) return '即将删除';
            if (daysLeft === 0) return '今天';
            if (daysLeft === 1) return '明天';
            return `${daysLeft} 天`;
        }

        // 获取剩余天数的颜色
        function getDaysLeftColor(deleteTime) {
            if (!deleteTime) return 'text-gray-600';
            const deleteDate = new Date(deleteTime);
            const deleteDeadline = new Date(deleteDate.getTime() + 30 * 24 * 60 * 60 * 1000);
            const now = new Date();
            const daysLeft = Math.ceil((deleteDeadline - now) / (1000 * 60 * 60 * 24));

            if (daysLeft <= 3) return 'text-red-600 font-semibold';
            if (daysLeft <= 7) return 'text-yellow-600 font-medium';
            return 'text-gray-600';
        }

        // 加载垃圾桶文件列表
        async function loadTrashFiles() {
            try {
                const res = await fetch('/api/trash');
                const data = await res.json();

                const tbody = document.getElementById('trashTableBody');
                const fileCountEl = document.getElementById('fileCount');
                const totalSizeEl = document.getElementById('totalSize');

                fileCountEl.textContent = data.files?.length || 0;
                totalSizeEl.textContent = formatSize(data.total_size || 0);

                if (!data.files || data.files.length === 0) {
                    tbody.innerHTML = `
                        <tr>
                            <td colspan="5" class="px-6 py-12 text-center text-gray-500">
                                垃圾桶为空
                            </td>
                        </tr>
                    `;
                    return;
                }

                tbody.innerHTML = data.files.map(file => `
                    <tr class="hover:bg-gray-50">
                        <td class="px-6 py-4">
                            <div class="text-sm font-medium text-gray-900 max-w-md truncate" title="${escapeHtml(file.name)}">
                                ${escapeHtml(file.name)}
                            </div>
                        </td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-600">
                            ${formatSize(file.size)}
                        </td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-600">
                            ${formatTime(file.delete_time)}
                        </td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm ${getDaysLeftColor(file.delete_time)}">
                            ${calculateDaysLeft(file.delete_time)}
                        </td>
                        <td class="px-6 py-4 whitespace-nowrap text-right text-sm font-medium">
                            <button onclick="restoreFile('${encodeURIComponent(file.path)}')" 
                                    class="text-blue-600 hover:text-blue-900 mr-3">
                                恢复
                            </button>
                            <button onclick="showDeleteModal('${encodeURIComponent(file.name)}')" 
                                    class="text-red-600 hover:text-red-900">
                                永久删除
                            </button>
                        </td>
                    </tr>
                `).join('');

            } catch (err) {
                console.error('加载垃圾桶失败:', err);
            }
        }

        // 显示删除确认对话框
        function showDeleteModal(encodedFilename) {
            const filename = decodeURIComponent(encodedFilename);
            deleteTarget = filename;
            document.getElementById('deleteFileName').textContent = filename;
            document.getElementById('deleteModal').classList.remove('hidden');
        }

        // 恢复文件
        async function restoreFile(encodedPath) {
            const path = decodeURIComponent(encodedPath);
            if (!confirm('确定要恢复该文件到原路径吗？')) return;

            try {
                const res = await fetch('/api/trash/restore', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ path })
                });

                const data = await res.json();
                if (res.ok) {
                    alert('文件已恢复到原路径');
                    loadTrashFiles();
                } else {
                    alert('恢复失败: ' + (data.error || '未知错误'));
                }
            } catch (err) {
                alert('恢复失败: ' + err.message);
            }
        }

        // 一键恢复全部文件
        async function restoreAllFiles() {
            if (!confirm('确定要恢复垃圾桶中的所有文件到原路径吗？')) return;
            if (!confirm('最后确认：将尝试恢复全部文件，是否继续？')) return;

            try {
                const res = await fetch('/api/trash/restore-all', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' }
                });
                const data = await res.json();

                if (res.status === 207) {
                    let msg = `部分恢复成功：成功 ${data.restored || 0} 个，失败 ${data.failed || 0} 个`;
                    if (Array.isArray(data.errors) && data.errors.length > 0) {
                        const sample = data.errors.slice(0, 3).map(e => `${e.name}: ${e.error}`).join('\n');
                        msg += `\n\n失败示例:\n${sample}`;
                    }
                    alert(msg);
                } else if (res.ok) {
                    alert(`恢复完成：成功 ${data.restored || 0} 个，失败 ${data.failed || 0} 个`);
                } else {
                    alert('批量恢复失败: ' + (data.error || '未知错误'));
                }
                loadTrashFiles();
            } catch (err) {
                alert('批量恢复失败: ' + err.message);
            }
        }

        // 关闭删除确认对话框
        function closeDeleteModal() {
            deleteTarget = null;
            document.getElementById('deleteModal').classList.add('hidden');
        }

        // 确认删除
        async function confirmDelete() {
            if (!deleteTarget) return;

            try {
                const res = await fetch(`/api/trash/${encodeURIComponent(deleteTarget)}`, {
                    method: 'DELETE'
                });

                if (res.ok) {
                    alert('文件已永久删除');
                    loadTrashFiles();
                } else {
                    const data = await res.json();
                    alert('删除失败: ' + (data.error || '未知错误'));
                }
            } catch (err) {
                alert('删除失败: ' + err.message);
            } finally {
                closeDeleteModal();
            }
        }

        // 清空垃圾桶
        async function emptyTrash() {
            if (!confirm('确定要清空垃圾桶吗？所有文件将被永久删除，此操作不可撤销！')) return;
            if (!confirm('最后确认：真的要删除垃圾桶中的所有文件吗？')) return;

            try {
                // TODO: 实现批量删除 API
                alert('功能开发中...');
            } catch (err) {
                alert('清空失败: ' + err.message);
            }
        }

        // 初始化
        loadTrashFiles();

        // 定期刷新（每 30 秒）
        setInterval(loadTrashFiles, 30000);
    </script>
</body>

</html>
